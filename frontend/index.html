<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S</title>
  <!-- Fixed CSS Path: removed duplicate 'frontend/' prefix -->
  <link rel="stylesheet" href="style.css?v=20261024reactorimage">
</head>
<body>
  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>MOBILE EDITION</p>
  </header>
  
  <div class="core">
    <div class="reactor-orbit orbit-a" aria-hidden="true"></div>
    <div class="reactor-orbit orbit-b" aria-hidden="true"></div>
    <div class="reactor-coils" aria-hidden="true"></div>
    <div class="reactor-plates" aria-hidden="true"></div>
    <div class="reactor-grid" aria-hidden="true"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="reactor-tick tick-a" aria-hidden="true"></div>
    <div class="reactor-tick tick-b" aria-hidden="true"></div>
    <div class="reactor-dot dot-a" aria-hidden="true"></div>
    <div class="reactor-dot dot-b" aria-hidden="true"></div>
    <div class="center"></div>
  </div>
  
  <p class="core-text">CORE ACTIVE</p>
  
  <div class="status">
    <h2>SYSTEM STATUS</h2>
    <div class="row"><span>AI CORE</span><b class="on">● ONLINE</b></div>
    <div class="row"><span>NETWORK</span><b class="on">● ONLINE</b></div>
    <div class="row"><span>VOICE</span><b class="off">○ LOCKED</b></div>
    <div class="row"><span>MEMORY</span><b class="off">○ LOCKED</b></div>
  </div>
  
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input id="msg" placeholder="Ask J.A.R.V.I.S...">
    <button id="send">SEND</button>
    <button id="mic-btn">🎙</button>
    <button id="cam-btn">📷</button>
    <button id="clear-btn">🧹</button>
    <input type="file" id="img-input" accept="image/*" capture="environment" style="display:none">
  </div>

  <!-- JavaScript linked properly at the end of the body -->
  <script src="./config.js?v=20261024backend" defer></script>
  <script src="./script.js?v=20261024backend2" defer></script>
</body>
</html>
